# ==============================================================================
# Prefix Key Configuration (Ctrl + Space)
# ==============================================================================

# Unbind default Ctrl+b and set Ctrl+Space as main prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ==============================================================================
# Configuration for window split 
# ==============================================================================


# Vertical split (side by side)
bind-key | split-window -h

# Horizontal split (top and bottom)
bind-key - split-window -v


# ==============================================================================
# Vim-Style Copy Mode & System Clipboard Sync (Wayland Fix)
# ==============================================================================

# 1. Enable Vi mode keys inside tmux copy mode
set-window-option -g mode-keys vi

# 2. Custom Vim-style keybindings in copy-mode-vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle

# 3. FIX: Bypass OSC 52 and pipe directly to Wayland's clipboard utility (wl-copy)
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'wl-copy'

# 4. If you also select text using the mouse, pipe that to wl-copy too
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'


# ==============================================================================
# General Settings & Mouse Support
# ==============================================================================

# Enable mouse support (click to switch panes, drag to resize, scroll history)
set -g mouse on

# Start window indexing at 1 instead of 0
set -g base-index 1
set-window-option -g pane-base-index 1

# Address vim mode switching delay (esc key response time)
set -s escape-time 0

# True color support (FIXED)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"


# ==============================================================================
# Pane Traversal (hjkl)
# ==============================================================================

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ==============================================================================
# Status Bar Styling (Modern Sleek Theme)
# ==============================================================================

# Position status bar at the top
set -g status-position top
set -g status-interval 5

# Overall status bar colors
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'

# Left side: Session name badge
set -g status-left-length 40
set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold] 󰙯 #S #[bg=#1e1e2e,fg=#89b4fa] '

# Window list styling
set -g window-status-format '#[fg=#6c7086,bg=#1e1e2e] #I:#W '
set -g window-status-current-format '#[bg=#f38ba8,fg=#1e1e2e,bold] #I:#W #[bg=#1e1e2e,fg=#f38ba8]'
set -g window-status-separator ''

# Right side: Date, time, and hostname
set -g status-right-length 60
set -g status-right '#[bg=#313244,fg=#cdd6f4] %Y-%m-%d 󰅐 %H:%M #[bg=#89b4fa,fg=#1e1e2e,bold] 󰒋 #h '


# ==============================================================================
# Reload Configuration
# ==============================================================================

bind r source-file ~/.tmux.conf \; display "~/.tmux.conf sourced!"
